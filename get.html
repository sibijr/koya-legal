<style>
  :root { --paper:#FFF3EC; --ink:#2E2226; --ink2:#75666B; --signal:#9B496B; --rule:#EACBD4; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }

  .stage { position:relative; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;

  /* Soft dawn glow behind the icon */
  .stage::before { content:""; position:absolute; left:50%; top:38%; width:640px; height:640px; transform:translate(-50%,-50%);
    background:radial-gradient(circle, #FAD3DE 0%, #FBE3E6 35%, rgba(255,243,236,0) 68%); z-index:-1; animation:breathe 6s ease-in-out infinite; }

  .icon { width:128px; height:128px; border-radius:29px; box-shadow:0 24px 50px -12px rgba(155,73,107,.45), 0 0 0 1px rgba(155,73,107,.08);

  .tag { font:500 italic 23px/1.3 "Cormorant Garamond", Georgia, serif; color:var(--signal); margin-top:8px; animation:rise .8s .14s cubic-bezier(.2,.8,.2,1) both; }

  /* App Store button: black, Apple-style, unmistakable */
  .store { display:flex; align-items:center; justify-content:center; gap:14px; width:100%; max-width:320px; height:72px; margin-top:36px;
    background:#000; color:#fff; text-decoration:none; border-radius:18px;
    box-shadow:0 18px 40px -10px rgba(46,34,38,.55); -webkit-tap-highlight-color:transparent;
    transition:transform .15s; animation:rise .8s .2s cubic-bezier(.2,.8,.2,1) both, nudge 3.2s 1.6s ease-in-out infinite; }
  .store:active { transform:scale(.97); }
  .store svg { width:34px; height:34px; fill:#fff; flex:none; margin-top:-4px; }
  .store span { display:flex; flex-direction:column; align-items:flex-start; line-height:1; }
  .store small { font:500 13px/1 -apple-system, Inter, sans-serif; letter-spacing:.01em; }
  .store b { font:600 28px/1.05 -apple-system, Inter, sans-serif; letter-spacing:-.02em; margin-top:3px; }
  @keyframes nudge { 0%,80%,100% { transform:none; } 86% { transform:translateY(-4px); } 92% { transform:none; } }

  .free { margin-top:18px; font-size:14px; color:var(--ink2); animation:rise .8s .26s cubic-bezier(.2,.8,.2,1) both; }
  .free b { color:var(--ink); font-weight:600; }

  /* Three quiet facts */
  .facts { display:flex; justify-content:center; gap:26px; margin-top:42px; animation:rise .8s .32s cubic-bezier(.2,.8,.2,1) both; }
  .facts div { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .facts b { font:500 26px/1 "Cormorant Garamond", Georgia, serif; color:var(--ink); }
  .facts span { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); }
  .facts i { width:1px; background:var(--rule); }

  .foot { position:absolute; bottom:calc(16px + env(safe-area-inset-bottom)); left:0; right:0; font-size:12px; color:#A89399; }
  .foot a { color:inherit; text-decoration:none; margin:0 8px; }

  @keyframes rise { from { opacity:0; transform:translateY(16px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; } }
